services:
  api-cpu:
    profiles: ["api-cpu"]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    image: edge-vision-bench:cpu
    ports:
      - "${EVB_PORT:-8000}:8000"
    environment:
      EVB_CONFIG: "${EVB_CONFIG:-/app/configs/yolox_s_sportsmot.yaml}"
      EVB_RUNTIME: "${EVB_RUNTIME:-onnxruntime}"
      EVB_PRECISION: "${EVB_PRECISION:-fp32}"
      EVB_DEVICE: "cpu"
      EVB_ARTIFACT: "${EVB_ARTIFACT:-}"
      EVB_RESULTS_DIR: "/app/results"
    volumes:
      - ./configs:/app/configs:ro
      - ./models/artifacts:/app/models/artifacts:ro
      - ./models/weights:/app/models/weights:ro
      - ./results:/app/results
    restart: unless-stopped

  api-gpu:
    profiles: ["api-gpu"]
    build:
      context: .
      dockerfile: docker/Dockerfile.gpu
    image: edge-vision-bench:gpu
    ports:
      - "${EVB_PORT:-8000}:8000"
    environment:
      EVB_CONFIG: "${EVB_CONFIG:-/app/configs/yolox_s_sportsmot.yaml}"
      EVB_RUNTIME: "${EVB_RUNTIME:-tensorrt}"
      EVB_PRECISION: "${EVB_PRECISION:-fp16}"
      EVB_DEVICE: "cuda"
      EVB_ARTIFACT: "${EVB_ARTIFACT:-}"
      EVB_RESULTS_DIR: "/app/results"
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
    volumes:
      - ./configs:/app/configs:ro
      - ./models/artifacts:/app/models/artifacts:ro
      - ./models/weights:/app/models/weights:ro
      - ./results:/app/results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  bench-runner:
    profiles: ["bench-runner"]
    build:
      context: .
      dockerfile: docker/Dockerfile.cpu
    image: edge-vision-bench:cpu
    environment:
      EVB_RESULTS_DIR: "/app/results"
    volumes:
      - ./configs:/app/configs:ro
      - ./models/artifacts:/app/models/artifacts
      - ./models/weights:/app/models/weights
      - ./results:/app/results
    entrypoint: ["evb"]
    command: ["--help"]
