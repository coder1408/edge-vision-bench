model_name: yolox-m
track: detection
input_size: [640, 640]
num_classes: 80
conf_threshold: 0.2
nms_threshold: 0.45
tracker_high_thresh: 0.45
tracker_low_thresh: 0.1
tracker_match_thresh: 0.8
tracker_track_buffer: 30
opset_version: 17
min_batch: 1
opt_batch: 4
max_batch: 16
warmup_runs: 50
parity_rtol: 1.0e-3
parity_atol: 1.0e-4
parity_min_cosine: 0.995
artifact_dir: models/artifacts
weights_dir: models/weights
results_dir: results
